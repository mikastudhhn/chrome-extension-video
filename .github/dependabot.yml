version: 2
updates:
  # Workflow actions are pinned to full commit SHAs; Dependabot proposes the
  # next pinned SHA (with its version comment) as a reviewed pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
