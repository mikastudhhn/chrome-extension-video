name: Verify and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its running verification.
  # Runs on main never cancel each other: every candidate keeps its evidence.
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every action is pinned to a full commit SHA (version in the comment);
# Dependabot proposes updates. No job before `release` can read the signing key.
jobs:
  build:
    name: Build candidate packages
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: metadata
        name: Identify candidate
        run: |
          base=$(node -p "require('./extension/manifest.json').version")
          {
            echo "tag=v${base}-preview.${GITHUB_RUN_NUMBER}"
            echo "build_number=${GITHUB_RUN_NUMBER}"
            echo "version=${base}.${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
      - name: Build both candidate profiles once
        env:
          VIDEO_SYNC_SERVER: ${{ vars.VIDEO_SYNC_SERVER }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          npm run package -- "${VIDEO_SYNC_SERVER:-http://localhost:8787}"
          PACKAGE_PROFILE=stable npm run package -- "${VIDEO_SYNC_SERVER:-http://localhost:8787}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}
          path: |
            dist/experimental/
            dist/stable/
          # Only jobs of this run (incl. same-day re-runs) download it; releases keep the files.
          retention-days: 3
  checks:
    name: Unit tests, checks and demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Verify portable demo generation
        run: |
          sudo apt-get install -y ffmpeg
          python3 -m venv "$RUNNER_TEMP/video-sync-demo-venv"
          "$RUNNER_TEMP/video-sync-demo-venv/bin/python" -m pip install -r scripts/requirements-demo.txt
          "$RUNNER_TEMP/video-sync-demo-venv/bin/python" tests/generate-demo.test.py
  browser:
    name: Browser suites (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [core-candidates, core-delayed, ui, updates]
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use the exact candidate ZIPs built once for this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.sha }}
          path: dist
      - name: Restore the pinned test browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install isolated test browser
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx --no-install playwright install-deps chromium
          else
            npx --no-install playwright install --with-deps chromium
          fi
          sudo apt-get install -y ffmpeg xvfb
      - name: Verify the group's browser suites serially against exact candidate ZIPs
        env:
          GROUP: ${{ matrix.group }}
        run: |
          git switch -c "ci/verify-${GITHUB_RUN_ID}"
          xvfb-run --auto-servernum npm run test:browser -- --skip-build --group="${GROUP}"
      - name: Retain browser diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.sha }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/browser-*/
          if-no-files-found: warn
          retention-days: 5
  verify:
    # Required status check: green only when the build, the checks and every browser group passed.
    needs: [build, checks, browser]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ needs.build.outputs.tag }}
    steps:
      - name: Require every gate job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            const failed = Object.entries(needs).filter(([, job]) => job.result !== "success").map(([name]) => name);
            if (failed.length) { console.error(`Gate jobs without success: ${failed.join(", ")}`); process.exit(1); }
          '
  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Protected environment: holds RELEASE_SIGNING_KEY, restricted to main and
    # gated by the owner's required review (configured in the repository settings).
    environment: release
    permissions:
      contents: write
    concurrency:
      group: publish-candidate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.sha }}
          path: dist
      - name: Sign and publish the tested files without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/publish-release.js
