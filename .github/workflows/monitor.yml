name: Monitor relay server
# Every 15 minutes: /health, certificate lifetime and new server incidents
# (scripts/monitor.js). A failed run sends GitHub's failure notification to
# whoever last changed the cron line. GitHub may start scheduled runs late and
# disables them after 60 days without repository activity (docs/hosting.md).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    name: Check relay server
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the previous run's start time; reads no secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/monitor.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check health, certificate and incidents
        env:
          VIDEO_SYNC_SERVER: ${{ vars.VIDEO_SYNC_SERVER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor.js "$VIDEO_SYNC_SERVER"
